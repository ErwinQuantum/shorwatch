name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    name: Build ${{ matrix.target }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-latest, target: x86_64-unknown-linux-gnu }
          - { os: windows-latest, target: x86_64-pc-windows-msvc }
          - { os: macos-latest, target: aarch64-apple-darwin }
          - { os: macos-latest, target: x86_64-apple-darwin }
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          targets: ${{ matrix.target }}
      # No build cache: release binaries are built from scratch, never from
      # a cache other workflows wrote.
      - run: cargo build --release --locked --target ${{ matrix.target }}
      - name: Package
        shell: bash
        run: |
          name="shorwatch-${GITHUB_REF_NAME}-${{ matrix.target }}"
          mkdir -p "dist/$name"
          cp README.md LICENSE CHANGELOG.md "dist/$name/"
          if [ "${{ runner.os }}" = Windows ]; then
            cp "target/${{ matrix.target }}/release/shorwatch.exe" "dist/$name/"
            (cd dist && 7z a -bso0 "$name.zip" "$name")
            archive="$name.zip"
          else
            cp "target/${{ matrix.target }}/release/shorwatch" "dist/$name/"
            tar -C dist -czf "dist/$name.tar.gz" "$name"
            archive="$name.tar.gz"
          fi
          # Windows runners have sha256sum, not shasum; macOS may lack it.
          sum="sha256sum"
          command -v sha256sum > /dev/null || sum="shasum -a 256"
          (cd dist && $sum "$archive" > "$archive.sha256")
          rm -r "dist/$name"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ${{ matrix.target }}
          path: dist/*

  publish:
    name: Publish the GitHub release
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
      # Build provenance: anyone can check an archive came from this
      # workflow (`gh attestation verify <file> --repo ErwinQuantum/shorwatch`).
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          path: dist
          merge-multiple: true
      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: dist/*
      # Notes: the CHANGELOG section of this version (`## [0.1.0]`); a
      # pre-release such as `v0.1.0-rc.1` uses the section of the version it
      # precedes, or `[Unreleased]` while that one is not written yet.
      - env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version="${GITHUB_REF_NAME#v}"
          flags=()
          section="$version"
          if [[ "$version" == *-* ]]; then
            flags+=(--prerelease)
            section="${version%%-*}"
          fi
          notes() {
            awk -v section="$1" '
              /^## \[/ { inside = index($0, "## [" section "]") == 1; next }
              inside
            ' CHANGELOG.md
          }
          notes "$section" > notes.md
          if [ ! -s notes.md ] && [[ "$version" == *-* ]]; then
            section="Unreleased"
            notes "$section" > notes.md
          fi
          if [ ! -s notes.md ]; then
            echo "No CHANGELOG section for $section" >&2
            exit 1
          fi
          gh release create "$GITHUB_REF_NAME" dist/* "${flags[@]}" \
            --repo "$GITHUB_REPOSITORY" --title "Shorwatch $GITHUB_REF_NAME" --notes-file notes.md
