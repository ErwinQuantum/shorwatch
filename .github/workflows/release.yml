name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    name: Build ${{ matrix.target }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-latest, target: x86_64-unknown-linux-gnu }
          - { os: windows-latest, target: x86_64-pc-windows-msvc }
          - { os: macos-latest, target: aarch64-apple-darwin }
          - { os: macos-latest, target: x86_64-apple-darwin }
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}
      - run: cargo build --release --locked --target ${{ matrix.target }}
      - name: Package
        shell: bash
        run: |
          name="shorwatch-${GITHUB_REF_NAME}-${{ matrix.target }}"
          mkdir -p "dist/$name"
          cp README.md LICENSE CHANGELOG.md "dist/$name/"
          if [ "${{ runner.os }}" = Windows ]; then
            cp "target/${{ matrix.target }}/release/shorwatch.exe" "dist/$name/"
            (cd dist && 7z a -bso0 "$name.zip" "$name")
            archive="$name.zip"
          else
            cp "target/${{ matrix.target }}/release/shorwatch" "dist/$name/"
            tar -C dist -czf "dist/$name.tar.gz" "$name"
            archive="$name.tar.gz"
          fi
          (cd dist && shasum -a 256 "$archive" > "$archive.sha256")
          rm -r "dist/$name"
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.target }}
          path: dist/*

  publish:
    name: Publish the GitHub release
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5
      - uses: actions/download-artifact@v5
        with:
          path: dist
          merge-multiple: true
      # Notes: the CHANGELOG section of this version (`## [0.1.0]`), or
      # `[Unreleased]` for a pre-release such as `v0.1.0-rc.1`.
      - env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version="${GITHUB_REF_NAME#v}"
          flags=()
          section="$version"
          if [[ "$version" == *-* ]]; then
            flags+=(--prerelease)
            section="Unreleased"
          fi
          awk -v section="$section" '
            /^## \[/ { inside = index($0, "## [" section "]") == 1; next }
            inside
          ' CHANGELOG.md > notes.md
          if [ ! -s notes.md ]; then
            echo "No CHANGELOG section for $section" >&2
            exit 1
          fi
          gh release create "$GITHUB_REF_NAME" dist/* "${flags[@]}" \
            --repo "$GITHUB_REPOSITORY" --title "Shorwatch $GITHUB_REF_NAME" --notes-file notes.md
