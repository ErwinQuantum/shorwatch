name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  fmt:
    name: Format
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - run: cargo fmt --all --check

  clippy:
    name: Clippy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo clippy --workspace --all-targets -- -D warnings

  test:
    name: Test (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo test --workspace

  msrv:
    name: MSRV (1.85)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@1.85
      - uses: Swatinem/rust-cache@v2
      - run: cargo check --workspace --all-targets

  cbom:
    name: CBOM schema
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Fetch the CycloneDX 1.6 schemas
        run: |
          mkdir -p target/cdx
          for f in bom-1.6.schema.json spdx.schema.json jsf-0.82.schema.json; do
            curl -fsSL -o "target/cdx/$f" \
              "https://raw.githubusercontent.com/CycloneDX/specification/1.6/schema/$f"
          done
      - run: pip install jsonschema==4.26.0 referencing==0.37.0
      - name: Validate the CBOM of the example and of every fixture
        run: |
          cargo run -q -- scan examples/spring-service --format cbom -o target/cdx/example.cdx.json
          cargo run -q -- scan shorwatch-rules/tests/fixtures --format cbom --fail-on never \
            -o target/cdx/fixtures.cdx.json
          python .github/scripts/validate_cbom.py target/cdx target/cdx/example.cdx.json
          python .github/scripts/validate_cbom.py target/cdx target/cdx/fixtures.cdx.json
