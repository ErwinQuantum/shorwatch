[package]
name = "shorwatch-cli"
description = "Shorwatch command line: finds quantum-vulnerable cryptography in source code."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
keywords.workspace = true
categories.workspace = true

[[bin]]
name = "shorwatch"
path = "src/main.rs"

[dependencies]
shorwatch-core.workspace = true
shorwatch-rules.workspace = true
shorwatch-langs.workspace = true
shorwatch-report.workspace = true
clap.workspace = true
ignore.workspace = true
rayon.workspace = true
anyhow.workspace = true
anstream.workspace = true
zip.workspace = true

# musl's allocator serializes threads: the static Linux build swaps it.
[target.'cfg(target_env = "musl")'.dependencies]
mimalloc.workspace = true

[dev-dependencies]
serde_json.workspace = true

[lints]
workspace = true
