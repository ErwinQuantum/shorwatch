[workspace]
resolver = "3"
members = [
    "shorwatch-core",
    "shorwatch-rules",
    "shorwatch-langs",
    "shorwatch-report",
    "shorwatch-cli",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.88"
license = "Apache-2.0"
repository = "https://github.com/ErwinQuantum/shorwatch"
keywords = ["sast", "post-quantum", "cryptography", "security", "static-analysis"]
categories = ["development-tools", "cryptography"]

[workspace.dependencies]
shorwatch-core = { path = "shorwatch-core", version = "0.1.0" }
shorwatch-rules = { path = "shorwatch-rules", version = "0.1.0" }
shorwatch-langs = { path = "shorwatch-langs", version = "0.1.0" }
shorwatch-report = { path = "shorwatch-report", version = "0.1.0" }

serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml_ng = "0.10"
regex = "1"
thiserror = "2"
anyhow = "1"
tree-sitter = "0.26"
tree-sitter-java = "0.23"
tree-sitter-kotlin-ng = "1.1"
tree-sitter-yaml = "0.7"
quick-xml = "0.42"
clap = { version = "4.5", features = ["derive", "env"] }
ignore = "0.4"
rayon = "1.10"
anstream = "1"
owo-colors = "4"
mimalloc = { version = "0.1", default-features = false }
zip = { version = "9.1", default-features = false, features = ["deflate-flate2-zlib-rs"] }
insta = { version = "1", features = ["yaml", "glob"] }

[workspace.lints.rust]
unsafe_code = "forbid"
missing_debug_implementations = "warn"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
# A curated part of `pedantic`: the lints that catch bugs or unclear docs,
# not the stylistic ones (`must_use` everywhere, `# Errors` sections).
cast_possible_truncation = "warn"
format_push_string = "warn"
match_wildcard_for_single_variants = "warn"
unnested_or_patterns = "warn"
doc_markdown = "warn"

[profile.release]
lto = "thin"
codegen-units = 1
strip = true
