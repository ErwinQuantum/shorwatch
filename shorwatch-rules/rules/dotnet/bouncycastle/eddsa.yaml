id: dotnet.bouncycastle.eddsa
profile: eddsa
platform: dotnet

# BouncyCastle for .NET (`BouncyCastle.Cryptography`, namespace Org.BouncyCastle): the
# lightweight classes the caller builds, and the `*Utilities` factories that take an
# algorithm name (the same names as the JCA ones in jvm/jca).
patterns:
  - construct: { type: Org.BouncyCastle.Crypto.Signers.Ed25519Signer }
  - construct: { type: Org.BouncyCastle.Crypto.Signers.Ed25519ctxSigner }
  - construct: { type: Org.BouncyCastle.Crypto.Signers.Ed25519phSigner }
  - construct: { type: Org.BouncyCastle.Crypto.Signers.Ed448Signer }
  - construct: { type: Org.BouncyCastle.Crypto.Signers.Ed448phSigner }
  - construct: { type: Org.BouncyCastle.Crypto.Generators.Ed25519KeyPairGenerator }
  - construct: { type: Org.BouncyCastle.Crypto.Generators.Ed448KeyPairGenerator }
  - call: { type: Org.BouncyCastle.Security.SignerUtilities, method: GetSigner, arg: { index: 0, matches: '(?i)^(EdDSA|Ed25519(ph|ctx)?|Ed448(ph)?|(OID\.)?1\.3\.101\.11[23])$' } }
  - call: { type: Org.BouncyCastle.Security.GeneratorUtilities, method: GetKeyPairGenerator, arg: { index: 0, matches: '(?i)^(EdDSA|Ed25519|Ed448|(OID\.)?1\.3\.101\.11[23])$' } }
