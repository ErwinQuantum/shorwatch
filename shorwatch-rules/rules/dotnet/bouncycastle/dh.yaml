id: dotnet.bouncycastle.dh
profile: dh
platform: dotnet

# BouncyCastle for .NET (`BouncyCastle.Cryptography`, namespace Org.BouncyCastle): the
# lightweight classes the caller builds, and the `*Utilities` factories that take an
# algorithm name (the same names as the JCA ones in jvm/jca).
patterns:
  - construct: { type: Org.BouncyCastle.Crypto.Agreement.DHBasicAgreement }
  - construct: { type: Org.BouncyCastle.Crypto.Agreement.DHAgreement }
  - construct: { type: Org.BouncyCastle.Crypto.Generators.DHKeyPairGenerator }
  - construct: { type: Org.BouncyCastle.Crypto.Generators.DHBasicKeyPairGenerator }
  - construct: { type: Org.BouncyCastle.Crypto.Generators.DHParametersGenerator }
  - call: { type: Org.BouncyCastle.Security.AgreementUtilities, method: GetBasicAgreement, arg: { index: 0, matches: '(?i)^(DH|DiffieHellman|DHwith\w*KDF|(OID\.)?(1\.2\.840\.113549\.1\.3\.1|1\.2\.840\.10046\.2\.1))$' } }
  - call: { type: Org.BouncyCastle.Security.GeneratorUtilities, method: GetKeyPairGenerator, arg: { index: 0, matches: '(?i)^(DH|DiffieHellman|(OID\.)?(1\.2\.840\.113549\.1\.3\.1|1\.2\.840\.10046\.2\.1))$' } }
