id: dotnet.bouncycastle.dsa
profile: dsa
platform: dotnet

# BouncyCastle for .NET (`BouncyCastle.Cryptography`, namespace Org.BouncyCastle): the
# lightweight classes the caller builds, and the `*Utilities` factories that take an
# algorithm name (the same names as the JCA ones in jvm/jca).
patterns:
  - construct: { type: Org.BouncyCastle.Crypto.Signers.DsaSigner }
  - construct: { type: Org.BouncyCastle.Crypto.Signers.DsaDigestSigner }
  - construct: { type: Org.BouncyCastle.Crypto.Generators.DsaKeyPairGenerator }
  - construct: { type: Org.BouncyCastle.Crypto.Generators.DsaParametersGenerator }
  - call: { type: Org.BouncyCastle.Security.SignerUtilities, method: GetSigner, arg: { index: 0, matches: '(?i)^(D?DSA|DETDSA|DSS|RawDSA|DSAWithSHA1|SHA-?1?/DSA|[\w-]+/DSA|[\d.]+with1\.2\.840\.10040\.4\.[13]|(OID\.)?(1\.2\.840\.10040\.4\.[13]|1\.3\.14\.3\.2\.(13|27)|2\.16\.840\.1\.101\.3\.4\.3\.[1-8])|.+with(DET|D)?DSA(inP1363Format)?)$' } }
  - call: { type: Org.BouncyCastle.Security.GeneratorUtilities, method: GetKeyPairGenerator, arg: { index: 0, matches: '(?i)^(DSA|(OID\.)?(1\.2\.840\.10040\.4\.[13]|1\.3\.14\.3\.2\.(12|27)))$' } }
