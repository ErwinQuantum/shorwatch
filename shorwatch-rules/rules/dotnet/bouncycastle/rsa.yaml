id: dotnet.bouncycastle.rsa
profile: rsa
platform: dotnet

# BouncyCastle for .NET (`BouncyCastle.Cryptography`, namespace Org.BouncyCastle): the
# lightweight classes the caller builds, and the `*Utilities` factories that take an
# algorithm name (the same names as the JCA ones in jvm/jca).
patterns:
  - construct: { type: Org.BouncyCastle.Crypto.Engines.RsaEngine }
  - construct: { type: Org.BouncyCastle.Crypto.Generators.RsaKeyPairGenerator }
  - construct: { type: Org.BouncyCastle.Crypto.Signers.RsaDigestSigner }
  - call: { type: Org.BouncyCastle.Security.GeneratorUtilities, method: GetKeyPairGenerator, arg: { index: 0, matches: '(?i)^(RSA(SSA-PSS)?|PSS|(OID\.)?(1\.2\.840\.113549\.1\.1(\.(1|7|10))?|2\.5\.8\.1\.1))$' } }
  - call: { type: Org.BouncyCastle.Security.CipherUtilities, method: GetCipher, arg: { index: 0, matches: '(?i)^(RSA(/|-KTS-KEM-KWS$|$)|(OID\.)?(1\.0\.18033\.2\.2\.4|1\.2\.840\.113549\.1\.9\.16\.3\.14)$)' } }
  - call: { type: Org.BouncyCastle.Security.SignerUtilities, method: GetSigner, arg: { index: 0, matches: '(?i)^(RSA|RAWRSA(SSA-PSS|PSS)?|RSASSA-PSS|PSS|RSAPSS|(OID\.)?(1\.2\.840\.113549\.1\.1\.([2-5]|10|1[1-6])|1\.3\.14\.3\.2\.29|1\.3\.36\.3\.3\.1\.[2-4]|1\.3\.6\.1\.5\.5\.7\.6\.3[01]|2\.16\.840\.1\.101\.3\.4\.3\.1[3-6])|[\w()-]+/RSA|.+with(RSA|RSASSA-PSS|RSAPSS)(Encryption|andMGF1|/PSS|/ISO9796-2|/X9\.31|andSHAKE(128|256))?)$' } }
