id: dotnet.bouncycastle.sha1
profile: sha1
platform: dotnet

# BouncyCastle for .NET (`BouncyCastle.Cryptography`, namespace Org.BouncyCastle): the
# lightweight classes the caller builds, and the `*Utilities` factories that take an
# algorithm name (the same names as the JCA ones in jvm/jca).
patterns:
  - construct: { type: Org.BouncyCastle.Crypto.Digests.Sha1Digest }
  - call: { type: Org.BouncyCastle.Security.DigestUtilities, method: GetDigest, arg: { index: 0, matches: '(?i)^(SHA(-?1(-?INTERLEAVE)?)?|(OID\.)?1\.3\.14\.3\.2\.26)$' } }
  - call: { type: Org.BouncyCastle.Security.SignerUtilities, method: GetSigner, arg: { index: 0, matches: '(?i)^(SHA-?1with.+|SHAwithDSA|DSAWithSHA1|SHA-?1?/DSA|SHA-?1/(RSA|(PLAIN-|CVC-)?ECDSA)|ECDSAwithSHA1|1\.3\.14\.3\.2\.26with1\.2\.840\.10040\.4\.[13]|DSA|DSS|MD5andSHA1withRSA|(OID\.)?(1\.2\.840\.10040\.4\.[13]|1\.2\.840\.10045\.4\.1|0\.4\.0\.127\.0\.7\.(1\.1\.4\.1|2\.2\.2\.2)\.1|1\.2\.840\.113549\.1\.1\.5|1\.3\.14\.3\.2\.(13|27|29)))$' } }
