id: jvm.nimbus.jose-rsa
profile: jose-rsa
platform: jvm

patterns:
  - field:
      type: com.nimbusds.jose.JWSAlgorithm
      matches: '^(RS|PS)(256|384|512)$'
  - field:
      type: com.nimbusds.jose.JWEAlgorithm
      matches: '^RSA(1_5|_OAEP(_(256|384|512))?)$'
  - call:
      type: com.nimbusds.jose.JWSAlgorithm
      method: parse
      arg: { index: 0, matches: '^(RS|PS)(256|384|512)$' }
  - call:
      type: com.nimbusds.jose.JWEAlgorithm
      method: parse
      arg: { index: 0, matches: '^RSA(1_5|-OAEP(-(256|384|512))?)$' }
  - construct: { type: com.nimbusds.jose.crypto.RSASSASigner }
  - construct: { type: com.nimbusds.jose.crypto.RSASSAVerifier }
  - construct: { type: com.nimbusds.jose.crypto.RSAEncrypter }
  - construct: { type: com.nimbusds.jose.crypto.RSADecrypter }
  - construct: { type: com.nimbusds.jose.jwk.gen.RSAKeyGenerator }
  - construct: { type: com.nimbusds.jose.jwk.RSAKey.Builder }
  # Algorithm families, e.g. `JWSAlgorithm.Family.RSA.contains(alg)`: accepting
  # any of them means depending on RSA.
  - field: { type: com.nimbusds.jose.JWSAlgorithm.Family, matches: '^RSA$' }
  - field: { type: com.nimbusds.jose.JWEAlgorithm.Family, matches: '^RSA$' }
