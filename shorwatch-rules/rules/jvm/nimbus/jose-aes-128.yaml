id: jvm.nimbus.jose-aes-128
profile: jose-aes-128
platform: jvm

patterns:
  - field:
      type: com.nimbusds.jose.EncryptionMethod
      matches: '^A128(GCM|CBC_HS256)$'
  - field:
      type: com.nimbusds.jose.JWEAlgorithm
      matches: '(^|_)A128(GCM)?KW$'
  # The same algorithms read from their JOSE names (`A128KW`, `ECDH-ES+A128KW`).
  - call:
      type: com.nimbusds.jose.EncryptionMethod
      method: parse
      arg: { index: 0, matches: '^A128(GCM|CBC-HS256)$' }
  - call:
      type: com.nimbusds.jose.JWEAlgorithm
      method: parse
      arg: { index: 0, matches: '(^|\+)A128(GCM)?KW$' }
