id: jvm.nimbus.jose-ecdh
profile: jose-ecdh
platform: jvm

patterns:
  # Only the `ES` names say the sender's key is fresh (RFC 7518 section 4.6);
  # ECDH-1PU adds a static key of the sender, so it stays undetermined.
  - field:
      shape: ephemeral-static
      type: com.nimbusds.jose.JWEAlgorithm
      matches: '^ECDH_ES'
  - field:
      type: com.nimbusds.jose.JWEAlgorithm
      matches: '^ECDH_1PU'
  - call:
      shape: ephemeral-static
      type: com.nimbusds.jose.JWEAlgorithm
      method: parse
      arg: { index: 0, matches: '^ECDH-ES' }
  - call:
      type: com.nimbusds.jose.JWEAlgorithm
      method: parse
      arg: { index: 0, matches: '^ECDH-1PU' }
  - field:
      type: com.nimbusds.jose.jwk.Curve
      matches: '^X(25519|448)$'
  - construct: { type: com.nimbusds.jose.crypto.ECDHEncrypter }
  - construct: { type: com.nimbusds.jose.crypto.ECDHDecrypter }
  - construct: { type: com.nimbusds.jose.crypto.X25519Encrypter }
  - construct: { type: com.nimbusds.jose.crypto.X25519Decrypter }
  # Algorithm families, e.g. `JWSAlgorithm.Family.RSA.contains(alg)`: accepting
  # any of them means depending on ECDH.
  - field: { shape: ephemeral-static, type: com.nimbusds.jose.JWEAlgorithm.Family, matches: '^ECDH_ES$' }
  - field: { type: com.nimbusds.jose.JWEAlgorithm.Family, matches: '^ECDH_1PU$' }
