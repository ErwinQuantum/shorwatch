id: jvm.bouncycastle.rsa
profile: rsa
platform: jvm

patterns:
  - construct:
      type: org.bouncycastle.crypto.engines.RSAEngine
  - construct:
      type: org.bouncycastle.crypto.engines.RSABlindedEngine
  - construct:
      type: org.bouncycastle.crypto.generators.RSAKeyPairGenerator
  # PKCS#1 v1.5 signatures: the signer builds its own RSA engine, so the
  # engine constructors above never appear in the caller's code.
  - construct:
      type: org.bouncycastle.crypto.signers.RSADigestSigner
