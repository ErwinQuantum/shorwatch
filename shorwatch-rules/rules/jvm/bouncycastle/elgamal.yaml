id: jvm.bouncycastle.elgamal
profile: elgamal
platform: jvm

patterns:
  - construct:
      type: org.bouncycastle.crypto.engines.ElGamalEngine
  - construct:
      type: org.bouncycastle.crypto.generators.ElGamalKeyPairGenerator
  - construct:
      type: org.bouncycastle.crypto.generators.ElGamalParametersGenerator
  - construct:
      type: org.bouncycastle.crypto.params.ElGamalParameters
  # The provider-level (JCE) way to give a key generator its group.
  - construct:
      type: org.bouncycastle.jce.spec.ElGamalParameterSpec
  - construct:
      type: org.bouncycastle.jce.spec.ElGamalGenParameterSpec
