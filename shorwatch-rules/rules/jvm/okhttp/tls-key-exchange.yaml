id: jvm.okhttp.tls-key-exchange
profile: tls-key-exchange
platform: jvm

# OkHttp names suites as constants: `ConnectionSpec.Builder.cipherSuites(CipherSuite.TLS_...)`.
patterns:
  - field:
      usage: key-transport
      type: okhttp3.CipherSuite
      matches: '^(TLS|SSL)_RSA_'
  - field:
      usage: key-agreement
      shape: ephemeral-ephemeral
      type: okhttp3.CipherSuite
      matches: '^(TLS|SSL)_((DHE|ECDHE)_|(DH|ECDH)_anon_)'
  - field:
      usage: key-agreement
      shape: ephemeral-static
      type: okhttp3.CipherSuite
      matches: '^(TLS|SSL)_(DH|ECDH)_(RSA|ECDSA|DSS)_'
