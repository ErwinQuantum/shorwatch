id: jvm.okhttp.tls-key-exchange
profile: tls-key-exchange
platform: jvm

# OkHttp names suites as constants: `ConnectionSpec.Builder.cipherSuites(CipherSuite.TLS_...)`.
patterns:
  - field:
      usage: key-transport
      type: okhttp3.CipherSuite
      matches: '^(TLS|SSL)_RSA_'
  - field:
      usage: key-agreement
      type: okhttp3.CipherSuite
      matches: '^(TLS|SSL)_(DHE?|ECDHE?)_'
