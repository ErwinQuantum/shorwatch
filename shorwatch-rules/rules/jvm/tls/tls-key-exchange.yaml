id: jvm.tls.tls-key-exchange
profile: tls-key-exchange
platform: jvm

# TLS configured in code, whatever the stack (JSSE `setEnabledCipherSuites`,
# Netty `SslContextBuilder.ciphers`, Jetty `setIncludeCipherSuites`, Tomcat
# connectors...). Suite names go through arrays, lists and constants that
# argument patterns cannot follow, but they are specific enough to match as
# plain string literals. Suites passed to an exclusion method are skipped.
#
# OpenSSL names write the key exchange as a prefix (`ECDHE-RSA-...`), except
# for static RSA, which has none (`AES256-SHA`, `AES128-GCM-SHA256`): those
# are listed by name, closed by a separator so `AES256-SHAKE` stays out.
patterns:
  - literal:
      matches: '(^|[,:\s])((TLS|SSL)_(RSA|DHE?|ECDHE?)_\w*WITH_\w+|(ECDHE?|DHE?|EDH)-(RSA|ECDSA|DSS)-|(AES(128|256)(-GCM)?-SHA(256|384)?|CAMELLIA(128|256)-SHA(256)?|DES-CBC3-SHA|RC4-(MD5|SHA)|SEED-SHA)($|[,:\s]))'
      unless_call: '(?i)(exclude|disable|remove|deny|block|reject)'
  # `System.setProperty("jdk.tls.namedGroups", "x25519,secp256r1")` with a
  # classical group in the list.
  - call:
      type: java.lang.System
      method: setProperty
      with_arg: { index: 0, matches: '^jdk\.tls\.([a-z]+\.)?namedGroups$' }
      arg: { index: 1, matches: '(?i)(^|,)\s*(x25519|x448|secp(256|384|521)r1|ffdhe\d+)\s*(,|$)' }
  # `SSLParameters.setNamedGroups(new String[] {"secp256r1"})`: group names are
  # too common as words to match anywhere, so they count only inside that call.
  - literal:
      matches: '(?i)^\s*(x25519|x448|secp(256|384|521)r1|ffdhe\d+)\s*$'
      in_call: '^setNamedGroups$'
