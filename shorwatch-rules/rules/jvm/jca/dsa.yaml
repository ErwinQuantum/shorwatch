id: jvm.jca.dsa
profile: dsa
platform: jvm

patterns:
  # JCA. `SHA256withDSA`, `NONEwithDSA`, BouncyCastle's deterministic `DDSA`,
  # and the older names the SUN provider still accepts as aliases: `DSS`,
  # `DSAWithSHA1`, `SHA1/DSA`, `RawDSA` and the signature OID.
  # `withECDSA` does not contain `withDSA`, so ECDSA names never match here.
  - call:
      type: java.security.Signature
      method: getInstance
      arg:
        index: 0
        matches: '(?i)^(D?DSA|DSS|RawDSA|DSAWithSHA1|SHA-?1?/DSA|(OID\.)?(1\.2\.840\.10040\.4\.3|1\.3\.14\.3\.2\.(13|27)|2\.16\.840\.1\.101\.3\.4\.3\.[1-8])|.+withD?DSA(inP1363Format)?)$'
  - call:
      type: java.security.KeyPairGenerator
      method: getInstance
      arg: { index: 0, matches: '(?i)^(DSA|(OID\.)?(1\.2\.840\.10040\.4\.1|1\.3\.14\.3\.2\.12))$' }
  - call:
      type: java.security.KeyFactory
      method: getInstance
      arg: { index: 0, matches: '(?i)^(DSA|(OID\.)?(1\.2\.840\.10040\.4\.1|1\.3\.14\.3\.2\.12))$' }
  - call:
      type: java.security.AlgorithmParameterGenerator
      method: getInstance
      arg: { index: 0, matches: '(?i)^(DSA|(OID\.)?(1\.2\.840\.10040\.4\.1|1\.3\.14\.3\.2\.12))$' }
  - call:
      type: java.security.AlgorithmParameters
      method: getInstance
      arg: { index: 0, matches: '(?i)^(DSA|(OID\.)?(1\.2\.840\.10040\.4\.1|1\.3\.14\.3\.2\.12))$' }
  - construct:
      type: java.security.spec.DSAParameterSpec
  - construct:
      type: java.security.spec.DSAPublicKeySpec
  - construct:
      type: java.security.spec.DSAPrivateKeySpec
