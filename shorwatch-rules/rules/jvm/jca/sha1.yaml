id: jvm.jca.sha1
profile: sha1
platform: jvm

# Deliberately not matched: HMAC-SHA1, PBKDF2WithHmacSHA1 and OAEP with SHA-1.
# Their security does not depend on collision resistance, and flagging them
# would bury real findings under noise.
patterns:
  # JCA. "SHA" is the standard alias of "SHA-1", and the JDK also takes the
  # algorithm OIDs as names.
  - call:
      type: java.security.MessageDigest
      method: getInstance
      arg: { index: 0, matches: '(?i)^(SHA(-?1)?|(OID\.)?1\.3\.14\.3\.2\.26)$' }
  # `SHA1withRSA`, and the older aliases of the SHA-1 signatures: `DSAWithSHA1`,
  # `SHAwithDSA`, `SHA1/DSA`, plain `DSA` and `DSS` (the JDK resolves both to
  # SHA1withDSA), TLS 1.0's `MD5andSHA1withRSA`, and the OIDs of sha1WithRSA (1.2.840.113549.1.1.5,
  # 1.3.14.3.2.29), dsa-with-sha1 (1.2.840.10040.4.3, 1.3.14.3.2.13, .27) and ecdsa-with-SHA1.
  - call:
      type: java.security.Signature
      method: getInstance
      arg:
        index: 0
        matches: '(?i)^(SHA-?1with.+|SHAwithDSA|DSAWithSHA1|SHA-?1?/DSA|DSA|DSS|MD5andSHA1withRSA|(OID\.)?(1\.2\.840\.10040\.4\.3|1\.2\.840\.10045\.4\.1|1\.2\.840\.113549\.1\.1\.5|1\.3\.14\.3\.2\.(13|27|29)))$'
