id: jvm.jca.aes-128
profile: aes-128
platform: jvm

patterns:
  # Key size requested from a JCA KeyGenerator. `origin` checks the algorithm
  # the generator was created with, so `KeyGenerator.getInstance("HmacSHA256")`
  # followed by `init(128)` is not reported. A generator of unknown origin
  # (a parameter, a field set elsewhere) is still reported: in practice
  # `KeyGenerator.init(128)` is overwhelmingly AES.
  - call:
      type: javax.crypto.KeyGenerator
      method: init
      arg: { index: 0, matches: '^128$' }
      origin: { index: 0, matches: '(?i)^AES' }
  # Size-pinned JCA transformations: `AES_128/GCM/NoPadding`, the key-wrap
  # names `AESWrap_128` / `AESWrapPad_128`, and the AES-128 mode OIDs.
  - call:
      type: javax.crypto.Cipher
      method: getInstance
      arg: { index: 0, matches: '(?i)^(AES_128(/|$)|AESWrap(Pad)?_128$|(OID\.)?2\.16\.840\.1\.101\.3\.4\.1\.[1-68]$)' }

# Applied to the argument as written: `128` -> `256`,
# `"AES_128/GCM/NoPadding"` -> `"AES_256/GCM/NoPadding"`. Values written in
# other forms (`0x80`, `128L`) or coming from a constant get no fix.
fix:
  description: Use a 256-bit AES key
  replace: '(?i)(^|AES_)128\b'
  with: '${1}256'
