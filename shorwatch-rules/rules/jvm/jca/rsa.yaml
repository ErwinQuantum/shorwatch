id: jvm.jca.rsa
profile: rsa
platform: jvm

patterns:
  - call:
      type: java.security.KeyPairGenerator
      method: getInstance
      arg: { index: 0, matches: '(?i)^(RSA(SSA-PSS)?|PSS|(OID\.)?(1\.2\.840\.113549\.1\.1(\.(1|7|10))?|2\.5\.8\.1\.1))$' }
  - call:
      type: java.security.KeyFactory
      method: getInstance
      arg: { index: 0, matches: '(?i)^(RSA(SSA-PSS)?|PSS|(OID\.)?(1\.2\.840\.113549\.1\.1(\.(1|7|10))?|2\.5\.8\.1\.1))$' }
  - call:
      type: javax.crypto.Cipher
      method: getInstance
      arg: { index: 0, matches: '(?i)^(RSA(/|-KTS-KEM-KWS$|$)|(OID\.)?(1\.0\.18033\.2\.2\.4|1\.2\.840\.113549\.1\.9\.16\.3\.14)$)' }
  - call:
      type: java.security.Signature
      method: getInstance
      arg: { index: 0, matches: '(?i)^(RSA|RAWRSA(SSA-PSS|PSS)?|RSASSA-PSS|PSS|RSAPSS|(OID\.)?(1\.2\.840\.113549\.1\.1\.([2-5]|10|1[1-6])|1\.3\.14\.3\.2\.29|1\.3\.36\.3\.3\.1\.[2-4]|1\.3\.6\.1\.5\.5\.7\.6\.3[01]|2\.16\.840\.1\.101\.3\.4\.3\.1[3-6])|[\w()-]+/RSA|.+with(RSA|RSASSA-PSS|RSAPSS)(Encryption|andMGF1|/PSS|/ISO9796-2|/X9\.31|andSHAKE(128|256))?)$' }
  - call:
      type: java.security.AlgorithmParameters
      method: getInstance
      arg: { index: 0, matches: '(?i)^(RSA|RSASSA-PSS|PSS|RAWRSAPSS|RSAPSS|[\w-]*with(RSA(/PSS|andMGF1|SSA-PSS|PSS))|(OID\.)?(1\.2\.840\.113549\.1\.1(\.1|\.10)|2\.5\.8\.1\.1))$' }
  - construct:
      type: java.security.spec.RSAKeyGenParameterSpec
