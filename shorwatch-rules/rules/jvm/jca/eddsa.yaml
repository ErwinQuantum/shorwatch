id: jvm.jca.eddsa
profile: eddsa
platform: jvm

patterns:
  # JCA (Java 15+, JEP 339) and BouncyCastle provider names, and the Ed25519 /
  # Ed448 OIDs, which the JDK accepts as names.
  - call:
      type: java.security.Signature
      method: getInstance
      arg: { index: 0, matches: '(?i)^(EdDSA|Ed25519(ph|ctx)?|Ed448(ph)?|(OID\.)?1\.3\.101\.11[23])$' }
  - call:
      type: java.security.KeyPairGenerator
      method: getInstance
      arg: { index: 0, matches: '(?i)^(EdDSA|Ed25519|Ed448|(OID\.)?1\.3\.101\.11[23])$' }
  - call:
      type: java.security.KeyFactory
      method: getInstance
      arg: { index: 0, matches: '(?i)^(EdDSA|Ed25519|Ed448|(OID\.)?1\.3\.101\.11[23])$' }
  - call:
      type: java.security.AlgorithmParameters
      method: getInstance
      arg: { index: 0, matches: '(?i)^(EdDSA|Ed25519|Ed448|(OID\.)?1\.3\.101\.11[23])$' }
  - construct:
      type: java.security.spec.EdECPublicKeySpec
  - construct:
      type: java.security.spec.EdECPrivateKeySpec
