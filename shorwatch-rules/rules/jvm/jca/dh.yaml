id: jvm.jca.dh
profile: dh
platform: jvm

patterns:
  # JCA / JCE. "DiffieHellman" is the standard alias of "DH".
  - call:
      type: javax.crypto.KeyAgreement
      method: getInstance
      arg: { index: 0, matches: '(?i)^(DH|DiffieHellman|DHwith\w*KDF|(OID\.)?(1\.2\.840\.113549\.1\.3\.1|1\.2\.840\.10046\.2\.1))$' }
  - call:
      type: java.security.KeyPairGenerator
      method: getInstance
      arg: { index: 0, matches: '(?i)^(DH|DiffieHellman|(OID\.)?(1\.2\.840\.113549\.1\.3\.1|1\.2\.840\.10046\.2\.1))$' }
  - call:
      type: java.security.KeyFactory
      method: getInstance
      arg: { index: 0, matches: '(?i)^(DH|DiffieHellman|(OID\.)?(1\.2\.840\.113549\.1\.3\.1|1\.2\.840\.10046\.2\.1))$' }
  - call:
      type: java.security.AlgorithmParameterGenerator
      method: getInstance
      arg: { index: 0, matches: '(?i)^(DH|DiffieHellman|(OID\.)?(1\.2\.840\.113549\.1\.3\.1|1\.2\.840\.10046\.2\.1))$' }
  - call:
      type: java.security.AlgorithmParameters
      method: getInstance
      arg: { index: 0, matches: '(?i)^(DH|DiffieHellman|(OID\.)?(1\.2\.840\.113549\.1\.3\.1|1\.2\.840\.10046\.2\.1))$' }
  - construct:
      type: javax.crypto.spec.DHParameterSpec
  - construct:
      type: javax.crypto.spec.DHGenParameterSpec
