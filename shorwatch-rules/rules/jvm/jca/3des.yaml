id: jvm.jca.3des
profile: 3des
platform: jvm

patterns:
  # JCA / JCE. Single DES ("DES") is a different, already broken algorithm
  # and does not match here. `DESedeWrap` is the key-wrapping cipher, and
  # `PBEWithMD5AndTripleDES` / `PBEWithSHA1AndDESede` are password-based
  # encryption over Triple DES.
  - call:
      type: javax.crypto.Cipher
      method: getInstance
      arg: { index: 0, matches: '(?i)^((DESede|TripleDES|3DES)(Wrap)?(/|$)|(PBEWith\w+And(TripleDES|DESede)|(OID\.)?1\.2\.840\.113549\.1\.12\.1\.3)$)' }
  - call:
      type: javax.crypto.KeyGenerator
      method: getInstance
      arg: { index: 0, matches: '(?i)^(DESede|TripleDES|3DES)$' }
  - call:
      type: javax.crypto.SecretKeyFactory
      method: getInstance
      arg: { index: 0, matches: '(?i)^((DESede|TripleDES|3DES)|PBEWith\w+And(TripleDES|DESede)|(OID\.)?1\.2\.840\.113549\.1\.12\.1\.3)$' }
  - call:
      type: java.security.AlgorithmParameters
      method: getInstance
      arg: { index: 0, matches: '(?i)^((DESede|TripleDES|3DES)|PBEWith\w+And(TripleDES|DESede)|(OID\.)?1\.2\.840\.113549\.1\.12\.1\.3)$' }
  - construct:
      type: javax.crypto.spec.SecretKeySpec
      arg: { index: 1, matches: '(?i)^(DESede|TripleDES|3DES)$' }
  - construct:
      type: javax.crypto.spec.DESedeKeySpec
