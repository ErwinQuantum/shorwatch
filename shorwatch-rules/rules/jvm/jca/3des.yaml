id: jvm.jca.3des
profile: 3des
platform: jvm

patterns:
  # JCA / JCE. Single DES ("DES") is a different, already broken algorithm
  # and does not match here. `DESedeWrap` is the key-wrapping cipher, and
  # `PBEWithMD5AndTripleDES` / `PBEWithSHA1AndDESede` are password-based
  # encryption over Triple DES.
  - call:
      type: javax.crypto.Cipher
      method: getInstance
      arg: { index: 0, matches: '(?i)^((DESede|TripleDES|3DES|TDEA)(Wrap|RFC32(11|17)Wrap)?(/|$)|(D?H?IES|ECIES)with(SHA\d+and)?DESede(-CBC)?$|(PBEWith\w+And(\d-?Key)?(TripleDES|DESede)(-CBC)?|(OID\.)?1\.2\.840\.113549\.1\.12\.1\.[34])$)' }
  - call:
      type: javax.crypto.KeyGenerator
      method: getInstance
      arg: { index: 0, matches: '(?i)^(DESede|TripleDES|3DES|TDEA)(Wrap)?$' }
  - call:
      type: javax.crypto.SecretKeyFactory
      method: getInstance
      arg: { index: 0, matches: '(?i)^((DESede|TripleDES|3DES|TDEA)|PBEWith\w+And(\d-?Key)?(TripleDES|DESede)(-CBC)?|(OID\.)?(1\.2\.840\.113549\.1\.12\.1\.[34]|1\.2\.840\.113549\.3\.7))$' }
  - call:
      type: java.security.AlgorithmParameters
      method: getInstance
      arg: { index: 0, matches: '(?i)^((DESede|TripleDES|3DES|TDEA)|PBEWith\w+And(\d-?Key)?(TripleDES|DESede)(-CBC)?|(OID\.)?(1\.2\.840\.113549\.1\.12\.1\.[34]|1\.2\.840\.113549\.3\.7))$' }
  - construct:
      type: javax.crypto.spec.SecretKeySpec
      arg: { index: 1, matches: '(?i)^(DESede|TripleDES|3DES)$' }
  - construct:
      type: javax.crypto.spec.DESedeKeySpec
  - call:
      type: java.security.AlgorithmParameterGenerator
      method: getInstance
      arg: { index: 0, matches: '(?i)^((DESede|TripleDES|3DES|TDEA)|(OID\.)?1\.2\.840\.113549\.3\.7)$' }
