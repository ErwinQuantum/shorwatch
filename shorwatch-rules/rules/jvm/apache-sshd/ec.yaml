id: jvm.apache-sshd.ec
profile: ec
platform: jvm

patterns:
  - field:
      type: org.apache.sshd.common.config.keys.KeyUtils
      matches: '^EC_ALGORITHM$'
  - call:
      type: org.apache.sshd.server.keyprovider.SimpleGeneratorHostKeyProvider
      method: setAlgorithm
      arg: { index: 0, matches: '(?i)^EC$' }
