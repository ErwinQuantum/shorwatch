id: keys.material.ecdsa
profile: ecdsa
platform: keys
message: >-
  An ECDSA key (an SSH key). Keys and certificates live for years, and
  whatever they protect or sign until they are replaced can be attacked later:
  a quantum computer running Shor's algorithm recovers the private key from
  the public one.

patterns:
  - key: { algorithm: '^ECDSA$' }
