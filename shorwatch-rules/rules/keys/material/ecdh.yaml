id: keys.material.ecdh
profile: ecdh
platform: keys
message: >-
  An X25519 or X448 key-agreement key. Keys and certificates live for years,
  and whatever they protect or sign until they are replaced can be attacked
  later: a quantum computer running Shor's algorithm recovers the private key
  from the public one.

patterns:
  - key: { algorithm: '^X(25519|448)$' }
