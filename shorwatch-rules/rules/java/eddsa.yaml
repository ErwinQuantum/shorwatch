id: java.crypto.eddsa
platform: jvm
algorithm: EdDSA
category: shor
severity: high
title: EdDSA (Ed25519/Ed448) signatures are forgeable with Shor's algorithm
message: >-
  EdDSA signing or verification detected (Ed25519 or Ed448). Edwards curves
  fix many implementation pitfalls of ECDSA, but their security still rests
  on the elliptic-curve discrete logarithm problem, which Shor's algorithm
  solves: a quantum attacker can derive the private key and forge signatures.
suggestion: >-
  Migrate signatures to ML-DSA (FIPS 204), or SLH-DSA (FIPS 205) for a
  conservative hash-based alternative. Expect much larger keys and
  signatures (ML-DSA-65: ~2 KB public key, ~3.3 KB signature, against 32 and
  64 bytes for Ed25519). Composite Ed25519 + ML-DSA signatures keep existing
  verifiers working during the transition.
references:
  - title: "FIPS 204: Module-Lattice-Based Digital Signature Standard (ML-DSA)"
    url: https://csrc.nist.gov/pubs/fips/204/final
  - title: "FIPS 205: Stateless Hash-Based Digital Signature Standard (SLH-DSA)"
    url: https://csrc.nist.gov/pubs/fips/205/final
  - title: "NIST IR 8547: Transition to Post-Quantum Cryptography Standards"
    url: https://csrc.nist.gov/pubs/ir/8547/ipd

patterns:
  # JCA (Java 15+, JEP 339) and BouncyCastle provider names.
  - call:
      type: java.security.Signature
      method: getInstance
      arg: { index: 0, matches: '(?i)^(EdDSA|Ed25519(ph|ctx)?|Ed448(ph)?)$' }
  - call:
      type: java.security.KeyPairGenerator
      method: getInstance
      arg: { index: 0, matches: '(?i)^(EdDSA|Ed25519|Ed448)$' }
  - call:
      type: java.security.KeyFactory
      method: getInstance
      arg: { index: 0, matches: '(?i)^(EdDSA|Ed25519|Ed448)$' }
  - construct:
      type: java.security.spec.EdECPublicKeySpec
  - construct:
      type: java.security.spec.EdECPrivateKeySpec

  # BouncyCastle lightweight API
  - construct:
      type: org.bouncycastle.crypto.signers.Ed25519Signer
  - construct:
      type: org.bouncycastle.crypto.signers.Ed25519ctxSigner
  - construct:
      type: org.bouncycastle.crypto.signers.Ed25519phSigner
  - construct:
      type: org.bouncycastle.crypto.signers.Ed448Signer
  - construct:
      type: org.bouncycastle.crypto.signers.Ed448phSigner
  - construct:
      type: org.bouncycastle.crypto.generators.Ed25519KeyPairGenerator
  - construct:
      type: org.bouncycastle.crypto.generators.Ed448KeyPairGenerator

  # net.i2p.crypto:eddsa, still common in SSH libraries.
  - construct:
      type: net.i2p.crypto.eddsa.EdDSAEngine

hybrid:
  scope: type
  markers:
    - import: '^org\.bouncycastle\.pqc\.'
    - import: '^org\.openquantumsafe\.'
    - type: '(?i)(kyber|dilithium|ml-?kem|ml-?dsa)'
    # Not `\b`: hybrid group names glue the parts together (X25519MLKEM768).
    - literal: '(?i)(^|[^a-z])(kyber|dilithium|ml-?kem|ml-?dsa)'
