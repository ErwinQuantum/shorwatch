id: java.crypto.ec
language: java
algorithm: ECC
category: shor
severity: high
title: Elliptic-curve keys are broken by Shor's algorithm
message: >-
  Generic elliptic-curve key material detected ("EC" key pairs, curve
  parameters). The same EC key can serve key agreement (ECDH) or signatures
  (ECDSA), and this call alone does not tell which, so it is reported on its
  own. Either way, Shor's algorithm recovers the private key from the public
  key. Where the file also performs the actual ECDH or ECDSA operation, that
  call gets its own, more specific finding.
suggestion: >-
  Find out what these keys are used for. For key agreement or encryption,
  move to ML-KEM (FIPS 203), ideally through a hybrid such as X25519MLKEM768
  during the transition. For signatures, move to ML-DSA (FIPS 204), possibly
  as a composite signature alongside ECDSA. Either way, this is a protocol
  migration, not a parameter swap.
references:
  - title: "FIPS 203: Module-Lattice-Based Key-Encapsulation Mechanism Standard (ML-KEM)"
    url: https://csrc.nist.gov/pubs/fips/203/final
  - title: "FIPS 204: Module-Lattice-Based Digital Signature Standard (ML-DSA)"
    url: https://csrc.nist.gov/pubs/fips/204/final
  - title: "NIST IR 8547: Transition to Post-Quantum Cryptography Standards"
    url: https://csrc.nist.gov/pubs/ir/8547/ipd

patterns:
  # JCA. Only the ambiguous "EC" name; ECDH/ECDSA-specific names belong to
  # `java.crypto.ecdh` and `java.crypto.ecdsa`.
  - call:
      type: java.security.KeyPairGenerator
      method: getInstance
      arg: { index: 0, matches: '(?i)^EC$' }
  - call:
      type: java.security.KeyFactory
      method: getInstance
      arg: { index: 0, matches: '(?i)^EC$' }
  - call:
      type: java.security.AlgorithmParameters
      method: getInstance
      arg: { index: 0, matches: '(?i)^EC$' }
  - construct:
      type: java.security.spec.ECGenParameterSpec
  - construct:
      type: java.security.spec.ECParameterSpec
  - construct:
      type: java.security.spec.ECPublicKeySpec
  - construct:
      type: java.security.spec.ECPrivateKeySpec

  # BouncyCastle lightweight API
  - construct:
      type: org.bouncycastle.crypto.generators.ECKeyPairGenerator

  # EC JWKs: the same key may sign (ES256) or agree on keys (ECDH-ES).
  - construct: { type: com.nimbusds.jose.jwk.gen.ECKeyGenerator }
  - construct: { type: com.nimbusds.jose.jwk.ECKey.Builder }
  - field:
      type: io.jsonwebtoken.security.Jwks.CRV
      matches: '^P(256|384|521)$'

hybrid:
  scope: type
  markers:
    - import: '^org\.bouncycastle\.pqc\.'
    - import: '^org\.openquantumsafe\.'
    - type: '(?i)(kyber|dilithium|ml-?kem|ml-?dsa)'
    # Not `\b`: hybrid group names glue the parts together (X25519MLKEM768).
    - literal: '(?i)(^|[^a-z])(kyber|dilithium|ml-?kem|ml-?dsa)'
