id: java.jwt.eddsa
language: java
algorithm: EdDSA (JOSE/JWT)
category: shor
severity: high
title: EdDSA-based JWT algorithm is forgeable with Shor's algorithm
message: >-
  A JWT or JOSE object is signed with EdDSA (Ed25519 or Ed448), or an
  Edwards-curve JWK is created. EdDSA avoids many ECDSA pitfalls, but its
  security still rests on the elliptic-curve discrete logarithm problem,
  which Shor's algorithm solves: a quantum attacker could derive the signing
  key from the published JWK and mint valid tokens.
suggestion: >-
  Plan the move to ML-DSA (FIPS 204) token signatures, being standardized for
  JOSE by the IETF COSE working group. Expect much larger tokens (an
  ML-DSA-44 signature is about 2.4 KB against 64 bytes for Ed25519). Make
  verifiers algorithm-agile now so issuers can switch without a flag day.
references:
  - title: "FIPS 204: Module-Lattice-Based Digital Signature Standard (ML-DSA)"
    url: https://csrc.nist.gov/pubs/fips/204/final
  - title: "IETF draft: ML-DSA for JOSE and COSE"
    url: https://datatracker.ietf.org/doc/draft-ietf-cose-dilithium/
  - title: "RFC 8037: CFRG Elliptic Curve Diffie-Hellman (ECDH) and Signatures in JOSE"
    url: https://www.rfc-editor.org/rfc/rfc8037

patterns:
  # jjwt 0.12+
  - field:
      type: io.jsonwebtoken.Jwts.SIG
      matches: '^EdDSA$'
  - field:
      type: io.jsonwebtoken.security.Jwks.CRV
      matches: '^Ed(25519|448)$'

  # Nimbus JOSE + JWT. X25519/X448 OKP keys belong to `java.jwt.ecdh`.
  - field:
      type: com.nimbusds.jose.JWSAlgorithm
      matches: '^(EdDSA|Ed25519|Ed448)$'
  - call:
      type: com.nimbusds.jose.JWSAlgorithm
      method: parse
      arg: { index: 0, matches: '^(EdDSA|Ed25519|Ed448)$' }
  - field:
      type: com.nimbusds.jose.jwk.Curve
      matches: '^Ed(25519|448)$'
  - construct: { type: com.nimbusds.jose.crypto.Ed25519Signer }
  - construct: { type: com.nimbusds.jose.crypto.Ed25519Verifier }

hybrid:
  scope: type
  markers:
    - import: '^org\.bouncycastle\.pqc\.'
    - import: '^org\.openquantumsafe\.'
    - type: '(?i)(kyber|dilithium|ml-?kem|ml-?dsa)'
    # Not `\b`: hybrid group names glue the parts together (X25519MLKEM768).
    - literal: '(?i)(^|[^a-z])(kyber|dilithium|ml-?kem|ml-?dsa)'
