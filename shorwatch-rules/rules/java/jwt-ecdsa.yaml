id: java.jwt.ecdsa
language: java
algorithm: ECDSA (JOSE/JWT)
category: shor
severity: high
title: ECDSA-based JWT algorithm is forgeable with Shor's algorithm
message: >-
  A JWT or JOSE object is signed with ECDSA (ES256, ES256K, ES384, ES512).
  Shor's algorithm recovers the private key from the public key, which is
  usually published in a JWKS endpoint, so a quantum attacker could mint
  valid tokens for any user.
suggestion: >-
  Plan the move to ML-DSA (FIPS 204) token signatures, being standardized for
  JOSE by the IETF COSE working group. ML-DSA signatures are around 2.4 to
  4.6 KB against 64 to 132 bytes for ECDSA, so check header size limits on
  proxies and cookies. Make verifiers algorithm-agile now (several keys in the
  JWKS, accepted algorithms pinned per key) so issuers can switch without a
  flag day.
references:
  - title: "FIPS 204: Module-Lattice-Based Digital Signature Standard (ML-DSA)"
    url: https://csrc.nist.gov/pubs/fips/204/final
  - title: "IETF draft: ML-DSA for JOSE and COSE"
    url: https://datatracker.ietf.org/doc/draft-ietf-cose-dilithium/
  - title: "RFC 7518: JSON Web Algorithms (JWA)"
    url: https://www.rfc-editor.org/rfc/rfc7518

patterns:
  # jjwt 0.12+ and the legacy SignatureAlgorithm enum.
  - field:
      type: io.jsonwebtoken.Jwts.SIG
      matches: '^ES(256|384|512)$'
  - field:
      type: io.jsonwebtoken.SignatureAlgorithm
      matches: '^ES(256|384|512)$'
  - call:
      type: io.jsonwebtoken.SignatureAlgorithm
      method: forName
      arg: { index: 0, matches: '^ES(256|384|512)$' }

  # Nimbus JOSE + JWT
  - field:
      type: com.nimbusds.jose.JWSAlgorithm
      matches: '^ES(256K?|384|512)$'
  - call:
      type: com.nimbusds.jose.JWSAlgorithm
      method: parse
      arg: { index: 0, matches: '^ES(256K?|384|512)$' }
  - construct: { type: com.nimbusds.jose.crypto.ECDSASigner }
  - construct: { type: com.nimbusds.jose.crypto.ECDSAVerifier }

  # Auth0 java-jwt
  - call: { type: com.auth0.jwt.algorithms.Algorithm, method: ECDSA256 }
  - call: { type: com.auth0.jwt.algorithms.Algorithm, method: ECDSA256K }
  - call: { type: com.auth0.jwt.algorithms.Algorithm, method: ECDSA384 }
  - call: { type: com.auth0.jwt.algorithms.Algorithm, method: ECDSA512 }

hybrid:
  scope: type
  markers:
    - import: '^org\.bouncycastle\.pqc\.'
    - import: '^org\.openquantumsafe\.'
    - type: '(?i)(kyber|dilithium|ml-?kem|ml-?dsa)'
    # Not `\b`: hybrid group names glue the parts together (X25519MLKEM768).
    - literal: '(?i)(^|[^a-z])(kyber|dilithium|ml-?kem|ml-?dsa)'
