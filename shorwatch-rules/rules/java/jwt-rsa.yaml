id: java.jwt.rsa
language: java
algorithm: RSA (JOSE/JWT)
category: shor
severity: high
title: RSA-based JWT/JOSE algorithm is broken by Shor's algorithm
message: >-
  A JWT or JOSE object is signed (RS256/384/512, PS256/384/512) or encrypted
  (RSA-OAEP, RSA1_5) with RSA. Shor's algorithm recovers the RSA private key
  from the public key, which is usually published in a JWKS endpoint: anyone
  could then mint valid tokens for your users, and encrypted tokens recorded
  today could be opened later.
suggestion: >-
  Plan the move to post-quantum JOSE algorithms: ML-DSA (FIPS 204) for token
  signatures, as being standardized for JOSE by the IETF COSE working group,
  and ML-KEM (FIPS 203) for encrypted tokens. Tokens are short-lived, so the
  urgent part is the signing key and the verifiers: make them algorithm-agile
  (publish several keys in the JWKS, pin the accepted algorithms per key)
  so issuers can switch without a flag day. RSA1_5 should be removed today
  regardless; it is vulnerable to padding-oracle attacks.
references:
  - title: "FIPS 204: Module-Lattice-Based Digital Signature Standard (ML-DSA)"
    url: https://csrc.nist.gov/pubs/fips/204/final
  - title: "FIPS 203: Module-Lattice-Based Key-Encapsulation Mechanism Standard (ML-KEM)"
    url: https://csrc.nist.gov/pubs/fips/203/final
  - title: "IETF draft: ML-DSA for JOSE and COSE"
    url: https://datatracker.ietf.org/doc/draft-ietf-cose-dilithium/
  - title: "RFC 7518: JSON Web Algorithms (JWA)"
    url: https://www.rfc-editor.org/rfc/rfc7518

patterns:
  # jjwt 0.12+ (Jwts.SIG / Jwts.KEY) and the legacy SignatureAlgorithm enum.
  - field:
      type: io.jsonwebtoken.Jwts.SIG
      matches: '^(RS|PS)(256|384|512)$'
  - field:
      type: io.jsonwebtoken.Jwts.KEY
      matches: '^RSA(1_5|_OAEP(_256)?)$'
  - field:
      type: io.jsonwebtoken.SignatureAlgorithm
      matches: '^(RS|PS)(256|384|512)$'
  - call:
      type: io.jsonwebtoken.SignatureAlgorithm
      method: forName
      arg: { index: 0, matches: '^(RS|PS)(256|384|512)$' }

  # Nimbus JOSE + JWT
  - field:
      type: com.nimbusds.jose.JWSAlgorithm
      matches: '^(RS|PS)(256|384|512)$'
  - field:
      type: com.nimbusds.jose.JWEAlgorithm
      matches: '^RSA(1_5|_OAEP(_(256|384|512))?)$'
  - call:
      type: com.nimbusds.jose.JWSAlgorithm
      method: parse
      arg: { index: 0, matches: '^(RS|PS)(256|384|512)$' }
  - construct: { type: com.nimbusds.jose.crypto.RSASSASigner }
  - construct: { type: com.nimbusds.jose.crypto.RSASSAVerifier }
  - construct: { type: com.nimbusds.jose.crypto.RSAEncrypter }
  - construct: { type: com.nimbusds.jose.crypto.RSADecrypter }
  - construct: { type: com.nimbusds.jose.jwk.gen.RSAKeyGenerator }
  - construct: { type: com.nimbusds.jose.jwk.RSAKey.Builder }

  # Auth0 java-jwt
  - call: { type: com.auth0.jwt.algorithms.Algorithm, method: RSA256 }
  - call: { type: com.auth0.jwt.algorithms.Algorithm, method: RSA384 }
  - call: { type: com.auth0.jwt.algorithms.Algorithm, method: RSA512 }

hybrid:
  scope: type
  markers:
    - import: '^org\.bouncycastle\.pqc\.'
    - import: '^org\.openquantumsafe\.'
    - type: '(?i)(kyber|dilithium|ml-?kem|ml-?dsa)'
    # Not `\b`: hybrid group names glue the parts together (X25519MLKEM768).
    - literal: '(?i)(^|[^a-z])(kyber|dilithium|ml-?kem|ml-?dsa)'
