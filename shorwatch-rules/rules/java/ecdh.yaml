id: java.crypto.ecdh
platform: jvm
algorithm: ECDH
category: shor
severity: high
title: Elliptic-curve Diffie-Hellman (including X25519/X448) is broken by Shor's algorithm
message: >-
  Elliptic-curve key agreement detected (ECDH, ECMQV, ECIES or the
  Montgomery-curve variants X25519/X448). Shor's algorithm solves the
  elliptic-curve discrete logarithm problem, so recorded key exchanges can be
  decrypted later (harvest now, decrypt later). X25519 is modern and
  well-implemented, but it is just as exposed to a quantum attacker.
suggestion: >-
  Move key establishment to ML-KEM (FIPS 203). The recommended transition is a
  hybrid key exchange such as X25519MLKEM768 (already deployed in TLS 1.3 by
  major browsers and CDNs): both shared secrets feed the key schedule, so the
  connection stays secure if either algorithm holds. This changes the
  handshake, so it is a protocol migration, not a parameter swap.
references:
  - title: "FIPS 203: Module-Lattice-Based Key-Encapsulation Mechanism Standard (ML-KEM)"
    url: https://csrc.nist.gov/pubs/fips/203/final
  - title: "NIST SP 800-227: Recommendations for Key-Encapsulation Mechanisms"
    url: https://csrc.nist.gov/pubs/sp/800/227/final
  - title: "NIST IR 8547: Transition to Post-Quantum Cryptography Standards"
    url: https://csrc.nist.gov/pubs/ir/8547/ipd

patterns:
  # JCA / JCE. "EC" key pairs are covered by `java.crypto.ec`, since the same
  # key can serve ECDH or ECDSA; here only unambiguous key-agreement names.
  - call:
      type: javax.crypto.KeyAgreement
      method: getInstance
      arg: { index: 0, matches: '(?i)^((ECDHC?|ECCDH|ECMQV)(with.+)?|XDH|X25519|X448)$' }
  - call:
      type: java.security.KeyPairGenerator
      method: getInstance
      arg: { index: 0, matches: '(?i)^(ECDHC?|ECMQV|XDH|X25519|X448)$' }
  - call:
      type: java.security.KeyFactory
      method: getInstance
      arg: { index: 0, matches: '(?i)^(ECDHC?|ECMQV|XDH|X25519|X448)$' }
  - call:
      type: javax.crypto.Cipher
      method: getInstance
      arg: { index: 0, matches: '(?i)^ECIES(with[^/]+)?(/|$)' }
  - construct:
      type: java.security.spec.XECPublicKeySpec
  - construct:
      type: java.security.spec.XECPrivateKeySpec

  # BouncyCastle lightweight API
  - construct:
      type: org.bouncycastle.crypto.agreement.ECDHBasicAgreement
  - construct:
      type: org.bouncycastle.crypto.agreement.ECDHCBasicAgreement
  - construct:
      type: org.bouncycastle.crypto.agreement.ECMQVBasicAgreement
  - construct:
      type: org.bouncycastle.crypto.agreement.X25519Agreement
  - construct:
      type: org.bouncycastle.crypto.agreement.X448Agreement
  - construct:
      type: org.bouncycastle.crypto.generators.X25519KeyPairGenerator
  - construct:
      type: org.bouncycastle.crypto.generators.X448KeyPairGenerator

hybrid:
  scope: type
  markers:
    - import: '^org\.bouncycastle\.pqc\.'
    - import: '^org\.openquantumsafe\.'
    - type: '(?i)(kyber|dilithium|ml-?kem|ml-?dsa)'
    # Not `\b`: hybrid group names glue the parts together (X25519MLKEM768).
    - literal: '(?i)(^|[^a-z])(kyber|dilithium|ml-?kem|ml-?dsa)'
