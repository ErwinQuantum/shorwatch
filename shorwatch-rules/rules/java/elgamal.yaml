id: java.crypto.elgamal
language: java
algorithm: ElGamal
category: shor
severity: high
title: ElGamal is broken by Shor's algorithm
message: >-
  ElGamal encryption or key generation detected. ElGamal rests on the discrete
  logarithm problem, which Shor's algorithm solves, so ciphertexts recorded
  today can be decrypted once a large quantum computer exists (harvest now,
  decrypt later). ElGamal mostly survives in OpenPGP keys and legacy
  BouncyCastle code.
suggestion: >-
  Replace public-key encryption with ML-KEM (FIPS 203) plus a symmetric AEAD
  (for example AES-256-GCM) to encrypt the payload under the encapsulated key.
  For OpenPGP, follow the post-quantum OpenPGP work (ML-KEM composite keys)
  rather than generating new ElGamal subkeys.
references:
  - title: "FIPS 203: Module-Lattice-Based Key-Encapsulation Mechanism Standard (ML-KEM)"
    url: https://csrc.nist.gov/pubs/fips/203/final
  - title: "NIST SP 800-227: Recommendations for Key-Encapsulation Mechanisms"
    url: https://csrc.nist.gov/pubs/sp/800/227/final
  - title: "NIST IR 8547: Transition to Post-Quantum Cryptography Standards"
    url: https://csrc.nist.gov/pubs/ir/8547/ipd

patterns:
  # Provider-based (BouncyCastle registers ElGamal in the JCA).
  - call:
      type: javax.crypto.Cipher
      method: getInstance
      arg: { index: 0, matches: '(?i)^ElGamal(/|$)' }
  - call:
      type: java.security.KeyPairGenerator
      method: getInstance
      arg: { index: 0, matches: '(?i)^ElGamal$' }
  - call:
      type: java.security.KeyFactory
      method: getInstance
      arg: { index: 0, matches: '(?i)^ElGamal$' }

  # BouncyCastle lightweight API
  - construct:
      type: org.bouncycastle.crypto.engines.ElGamalEngine
  - construct:
      type: org.bouncycastle.crypto.generators.ElGamalKeyPairGenerator
  - construct:
      type: org.bouncycastle.crypto.generators.ElGamalParametersGenerator
  - construct:
      type: org.bouncycastle.crypto.params.ElGamalParameters

hybrid:
  scope: type
  markers:
    - import: '^org\.bouncycastle\.pqc\.'
    - import: '^org\.openquantumsafe\.'
    - type: '(?i)(kyber|dilithium|ml-?kem|ml-?dsa)'
    # Not `\b`: hybrid group names glue the parts together (X25519MLKEM768).
    - literal: '(?i)(^|[^a-z])(kyber|dilithium|ml-?kem|ml-?dsa)'
