id: java.crypto.dsa
language: java
algorithm: DSA
category: shor
severity: high
title: DSA signatures are forgeable with Shor's algorithm
message: >-
  DSA signing, verification or key generation detected. DSA rests on the
  finite-field discrete logarithm problem, which Shor's algorithm solves, so a
  quantum attacker can derive the private key and forge signatures. FIPS 186-5
  already withdrew DSA for generating new signatures, even before quantum
  concerns.
suggestion: >-
  Migrate signatures to ML-DSA (FIPS 204), or SLH-DSA (FIPS 205) for a
  conservative hash-based alternative. Keep DSA only to verify legacy
  signatures, and plan to re-sign long-lived artifacts with the new scheme.
references:
  - title: "FIPS 204: Module-Lattice-Based Digital Signature Standard (ML-DSA)"
    url: https://csrc.nist.gov/pubs/fips/204/final
  - title: "FIPS 186-5: Digital Signature Standard (DSA withdrawn for signature generation)"
    url: https://csrc.nist.gov/pubs/fips/186-5/final
  - title: "NIST IR 8547: Transition to Post-Quantum Cryptography Standards"
    url: https://csrc.nist.gov/pubs/ir/8547/ipd

patterns:
  # JCA. `SHA256withDSA`, `NONEwithDSA`, BouncyCastle's deterministic `DDSA`.
  # `withECDSA` does not contain `withDSA`, so ECDSA names never match here.
  - call:
      type: java.security.Signature
      method: getInstance
      arg: { index: 0, matches: '(?i)^(D?DSA|.+withD?DSA(inP1363Format)?)$' }
  - call:
      type: java.security.KeyPairGenerator
      method: getInstance
      arg: { index: 0, matches: '(?i)^DSA$' }
  - call:
      type: java.security.KeyFactory
      method: getInstance
      arg: { index: 0, matches: '(?i)^DSA$' }
  - call:
      type: java.security.AlgorithmParameterGenerator
      method: getInstance
      arg: { index: 0, matches: '(?i)^DSA$' }
  - construct:
      type: java.security.spec.DSAParameterSpec
  - construct:
      type: java.security.spec.DSAPublicKeySpec
  - construct:
      type: java.security.spec.DSAPrivateKeySpec

  # BouncyCastle lightweight API
  - construct:
      type: org.bouncycastle.crypto.signers.DSASigner
  - construct:
      type: org.bouncycastle.crypto.generators.DSAKeyPairGenerator
  - construct:
      type: org.bouncycastle.crypto.generators.DSAParametersGenerator

hybrid:
  scope: type
  markers:
    - import: '^org\.bouncycastle\.pqc\.'
    - import: '^org\.openquantumsafe\.'
    - type: '(?i)(kyber|dilithium|ml-?kem|ml-?dsa)'
    # Not `\b`: hybrid group names glue the parts together (X25519MLKEM768).
    - literal: '(?i)(^|[^a-z])(kyber|dilithium|ml-?kem|ml-?dsa)'
