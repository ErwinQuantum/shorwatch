algorithm: RSA (JOSE/JWT)
category: shor
severity: high
title: RSA-based JWT/JOSE algorithm is broken by Shor's algorithm
message: >-
  A JWT or JOSE object is signed (RS256/384/512, PS256/384/512) or encrypted
  (RSA-OAEP, RSA1_5) with RSA. Shor's algorithm recovers the RSA private key
  from the public key, which is usually published in a JWKS endpoint: anyone
  could then mint valid tokens for your users, and encrypted tokens recorded
  today could be opened later.
suggestion: >-
  Plan the move to post-quantum JOSE algorithms: ML-DSA (FIPS 204) for token
  signatures (standardized for JOSE in RFC 9964: ML-DSA-44, -65, -87),
  and ML-KEM (FIPS 203) for encrypted tokens. Tokens are short-lived, so the
  urgent part is the signing key and the verifiers: make them algorithm-agile
  (publish several keys in the JWKS, pin the accepted algorithms per key)
  so issuers can switch without a flag day. RSA1_5 should be removed today
  regardless; it is vulnerable to padding-oracle attacks.
suggestions:
  key-transport: >-
    A JWE key-management algorithm (RSA-OAEP, RSA1_5) wraps the content
    encryption key with RSA here. Move to ML-KEM (FIPS 203) once a
    standardized ML-KEM algorithm for JWE is available in your JOSE stack,
    and until then avoid putting long-lived secrets in tokens encrypted
    with RSA: recorded tokens can be opened later. RSA1_5 should be removed
    today regardless; it is vulnerable to padding-oracle attacks.
  key-generation: >-
    An RSA JWK is generated here, and the call does not say what it is for.
    Find out: if it signs tokens, move to ML-DSA (FIPS 204; standardized for
    JOSE in RFC 9964: ML-DSA-44, -65, -87) and make verifiers
    algorithm-agile; if it encrypts them, see the advice for ML-KEM
    (FIPS 203) in JWE. No RSA key size resists Shor's algorithm.
references:
  - title: "Shorwatch: why RSA (JOSE/JWT) is flagged"
    url: https://github.com/ErwinQuantum/shorwatch/blob/main/docs/algorithms/jose-rsa.md
  - title: "FIPS 204: Module-Lattice-Based Digital Signature Standard (ML-DSA)"
    url: https://csrc.nist.gov/pubs/fips/204/final
  - title: "FIPS 203: Module-Lattice-Based Key-Encapsulation Mechanism Standard (ML-KEM)"
    url: https://csrc.nist.gov/pubs/fips/203/final
  - title: "RFC 9964: ML-DSA for JOSE and COSE"
    url: https://www.rfc-editor.org/rfc/rfc9964
  - title: "RFC 7518: JSON Web Algorithms (JWA)"
    url: https://www.rfc-editor.org/rfc/rfc7518
hybrid: pqc
usage: signature
crypto:
  primitive: signature
  functions: [sign, verify, encrypt, decrypt]
  nist_quantum_security_level: 0
