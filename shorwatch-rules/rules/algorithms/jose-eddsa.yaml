algorithm: EdDSA (JOSE/JWT)
category: shor
severity: high
title: EdDSA-based JWT algorithm is forgeable with Shor's algorithm
message: >-
  A JWT or JOSE object is signed with EdDSA (Ed25519 or Ed448), or an
  Edwards-curve JWK is created. EdDSA avoids many ECDSA pitfalls, but its
  security still rests on the elliptic-curve discrete logarithm problem,
  which Shor's algorithm solves: a quantum attacker could derive the signing
  key from the published JWK and mint valid tokens.
suggestion: >-
  Plan the move to ML-DSA (FIPS 204) token signatures, standardized for JOSE
  in RFC 9964 (`ML-DSA-44`, `ML-DSA-65`, `ML-DSA-87`). Expect much larger tokens (an
  ML-DSA-44 signature is about 2.4 KB against 64 bytes for Ed25519). Make
  verifiers algorithm-agile now so issuers can switch without a flag day.
references:
  - title: "FIPS 204: Module-Lattice-Based Digital Signature Standard (ML-DSA)"
    url: https://csrc.nist.gov/pubs/fips/204/final
  - title: "RFC 9964: ML-DSA for JOSE and COSE"
    url: https://www.rfc-editor.org/rfc/rfc9964
  - title: "RFC 8037: CFRG Elliptic Curve Diffie-Hellman (ECDH) and Signatures in JOSE"
    url: https://www.rfc-editor.org/rfc/rfc8037
hybrid: pqc
crypto:
  primitive: signature
  functions: [sign, verify]
  nist_quantum_security_level: 0
