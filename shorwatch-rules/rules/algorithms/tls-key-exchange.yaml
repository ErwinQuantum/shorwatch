algorithm: TLS key exchange
category: shor
severity: high
title: TLS cipher suites with classical key exchange are exposed to harvest-now-decrypt-later
message: >-
  TLS 1.2 cipher suites configured with RSA, DHE or ECDHE key exchange. All
  three rest on problems Shor's algorithm solves, so TLS traffic recorded
  today can be decrypted once a large quantum computer exists. Suites with
  static RSA key exchange (TLS_RSA_WITH_*) also lack forward secrecy: a
  single leaked server key opens every past session, even without a quantum
  computer.
suggestion: >-
  Prefer TLS 1.3 and enable a hybrid post-quantum key exchange group such as
  X25519MLKEM768 wherever your TLS stack and peers support it, keeping a
  classical group as fallback during the transition. Hybrid key exchange
  protects recorded traffic now, without waiting for post-quantum
  certificates. Remove static RSA suites today.
suggestions:
  key-transport: >-
    These suites use static RSA key exchange (TLS_RSA_WITH_*): the client
    encrypts the secret to the server's RSA key. Remove them today. They have
    no forward secrecy, so one leaked server key opens every recorded session
    even without a quantum computer. Prefer TLS 1.3 and enable a hybrid
    post-quantum key exchange group such as X25519MLKEM768 wherever your TLS
    stack and peers support it, keeping a classical group as fallback during
    the transition.
  key-agreement: >-
    These suites agree a key with DHE or ECDHE: forward-secret today, but
    Shor's algorithm breaks the exchange, so recorded traffic can be decrypted
    once a large quantum computer exists. Prefer TLS 1.3 and enable a hybrid
    post-quantum key exchange group such as X25519MLKEM768 wherever your TLS
    stack and peers support it, keeping a classical group as fallback during
    the transition. Hybrid key exchange protects recorded traffic now,
    without waiting for post-quantum certificates.
shape_suggestions:
  ephemeral-static: >-
    These suites (TLS_DH_*, TLS_ECDH_*) use the server's long-term
    Diffie-Hellman key from its certificate instead of a fresh one for each
    connection (RFC 5246 appendix A.5; RFC 8422 section 2 says forward
    secrecy needs fresh ephemeral keys), so one leaked server key opens every
    recorded session even without a quantum computer. Remove them today.
    Prefer TLS 1.3 and enable a hybrid post-quantum key exchange group such as
    X25519MLKEM768 wherever your TLS stack and peers support it, keeping a
    classical group as fallback during the transition.
  static-static: >-
    Both sides use long-lived key pairs here, each authenticating the other
    (the static unified model of NIST SP 800-56A). ML-KEM (FIPS 203) is the
    algorithm to move to, but there is no one-to-one replacement for this
    shape: the protocol has to change. NIST SP 800-227 section 5.2 gives
    examples of authenticated key establishment built from KEMs (section 5.2.5
    authenticates both parties with static KEM keys in certificates, plus a
    fresh ephemeral KEM key), which are illustrations and not standardized
    protocols. NIST IR 8547 puts every Diffie-Hellman variant of SP 800-56A,
    static or ephemeral, on the same schedule (deprecated after 2030,
    disallowed after 2035), so plan the redesign now.
references:
  - title: "Shorwatch: why TLS key exchange is flagged"
    url: https://github.com/ErwinQuantum/shorwatch/blob/main/docs/algorithms/tls-key-exchange.md
  - title: "FIPS 203: Module-Lattice-Based Key-Encapsulation Mechanism Standard (ML-KEM)"
    url: https://csrc.nist.gov/pubs/fips/203/final
  - title: "RFC 9954: Hybrid key exchange in TLS 1.3"
    url: https://www.rfc-editor.org/rfc/rfc9954
  - title: "RFC 10024: Post-Quantum Traditional (PQ/T) Hybrid Key Agreement Mechanisms for TLS 1.3"
    url: https://www.rfc-editor.org/rfc/rfc10024
  - title: "NIST IR 8547: Transition to Post-Quantum Cryptography Standards"
    url: https://csrc.nist.gov/pubs/ir/8547/final
hybrid: pqc
crypto:
  primitive: key-agree
  functions: [keyderive]
  nist_quantum_security_level: 0
