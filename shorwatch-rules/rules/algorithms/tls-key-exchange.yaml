algorithm: TLS key exchange
category: shor
severity: high
title: TLS cipher suites with classical key exchange are exposed to harvest-now-decrypt-later
message: >-
  TLS 1.2 cipher suites configured with RSA, DHE or ECDHE key exchange. All
  three rest on problems Shor's algorithm solves, so TLS traffic recorded
  today can be decrypted once a large quantum computer exists. Suites with
  static RSA key exchange (TLS_RSA_WITH_*) also lack forward secrecy: a
  single leaked server key opens every past session, even without a quantum
  computer.
suggestion: >-
  Prefer TLS 1.3 and enable a hybrid post-quantum key exchange group such as
  X25519MLKEM768 wherever your TLS stack and peers support it, keeping a
  classical group as fallback during the transition. Hybrid key exchange
  protects recorded traffic now, without waiting for post-quantum
  certificates. Remove static RSA suites today.
references:
  - title: "FIPS 203: Module-Lattice-Based Key-Encapsulation Mechanism Standard (ML-KEM)"
    url: https://csrc.nist.gov/pubs/fips/203/final
  - title: "IETF draft: Hybrid key exchange in TLS 1.3"
    url: https://datatracker.ietf.org/doc/draft-ietf-tls-hybrid-design/
  - title: "IETF draft: Post-quantum hybrid ECDHE-MLKEM key agreement for TLS 1.3"
    url: https://datatracker.ietf.org/doc/draft-ietf-tls-ecdhe-mlkem/
  - title: "NIST IR 8547: Transition to Post-Quantum Cryptography Standards"
    url: https://csrc.nist.gov/pubs/ir/8547/ipd
hybrid: pqc
