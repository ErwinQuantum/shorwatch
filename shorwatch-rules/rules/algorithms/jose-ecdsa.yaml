algorithm: ECDSA (JOSE/JWT)
category: shor
severity: high
title: ECDSA-based JWT algorithm is forgeable with Shor's algorithm
message: >-
  A JWT or JOSE object is signed with ECDSA (ES256, ES256K, ES384, ES512).
  Shor's algorithm recovers the private key from the public key, which is
  usually published in a JWKS endpoint, so a quantum attacker could mint
  valid tokens for any user.
suggestion: >-
  Plan the move to ML-DSA (FIPS 204) token signatures, being standardized for
  JOSE by the IETF COSE working group. ML-DSA signatures are around 2.4 to
  4.6 KB against 64 to 132 bytes for ECDSA, so check header size limits on
  proxies and cookies. Make verifiers algorithm-agile now (several keys in the
  JWKS, accepted algorithms pinned per key) so issuers can switch without a
  flag day.
references:
  - title: "FIPS 204: Module-Lattice-Based Digital Signature Standard (ML-DSA)"
    url: https://csrc.nist.gov/pubs/fips/204/final
  - title: "IETF draft: ML-DSA for JOSE and COSE"
    url: https://datatracker.ietf.org/doc/draft-ietf-cose-dilithium/
  - title: "RFC 7518: JSON Web Algorithms (JWA)"
    url: https://www.rfc-editor.org/rfc/rfc7518
hybrid: pqc
crypto:
  primitive: signature
  functions: [sign, verify]
  nist_quantum_security_level: 0
