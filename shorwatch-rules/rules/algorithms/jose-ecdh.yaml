algorithm: ECDH (JOSE/JWE)
category: shor
severity: high
title: ECDH-based JWE key agreement is broken by Shor's algorithm
message: >-
  An encrypted JWT/JWE uses elliptic-curve key agreement (ECDH-ES and its
  key-wrapping variants, ECDH-1PU, or X25519/X448 keys). Shor's algorithm
  solves the elliptic-curve discrete logarithm problem, so tokens recorded
  today can be decrypted once a large quantum computer exists (harvest now,
  decrypt later).
suggestion: >-
  Move JWE key management to a post-quantum KEM based on ML-KEM (FIPS 203);
  the IETF JOSE working group is defining how ML-KEM plugs into JWE. Until
  then, prefer short-lived tokens and avoid putting long-lived secrets inside
  encrypted JWTs. This changes the JWE key-management algorithm, so all
  producers and consumers must be migrated together.
shape_suggestions:
  ephemeral-static: >-
    ECDH-ES: the sender generates a fresh key for every key agreement and the
    recipient's key is long-lived (RFC 7518 section 4.6). That is already the
    shape of a KEM: the sender encapsulates to the recipient's public key (NIST
    SP 800-227 section 5.1.1 builds ECDH-KEM from this scheme). The move is
    ML-KEM (FIPS 203) for the content-encryption key, once a standardized
    ML-KEM algorithm for JWE is available in your JOSE stack. Until then,
    avoid putting long-lived secrets in tokens encrypted this way: recorded
    tokens can be opened later. This changes the JWE key-management
    algorithm, so producers and consumers migrate together.
  static-static: >-
    Both sides use long-lived key pairs here, each authenticating the other
    (the static unified model of NIST SP 800-56A). ML-KEM (FIPS 203) is the
    algorithm to move to, but there is no one-to-one replacement for this
    shape: the protocol has to change. NIST SP 800-227 section 5.2 gives
    examples of authenticated key establishment built from KEMs (section 5.2.5
    authenticates both parties with static KEM keys in certificates, plus a
    fresh ephemeral KEM key), which are illustrations and not standardized
    protocols. NIST IR 8547 puts every Diffie-Hellman variant of SP 800-56A,
    static or ephemeral, on the same schedule (deprecated after 2030,
    disallowed after 2035), so plan the redesign now.
references:
  - title: "Shorwatch: why ECDH (JOSE/JWE) is flagged"
    url: https://github.com/ErwinQuantum/shorwatch/blob/main/docs/algorithms/jose-ecdh.md
  - title: "FIPS 203: Module-Lattice-Based Key-Encapsulation Mechanism Standard (ML-KEM)"
    url: https://csrc.nist.gov/pubs/fips/203/final
  - title: "NIST SP 800-227: Recommendations for Key-Encapsulation Mechanisms"
    url: https://csrc.nist.gov/pubs/sp/800/227/final
  - title: "RFC 7518: JSON Web Algorithms (JWA)"
    url: https://www.rfc-editor.org/rfc/rfc7518
hybrid: pqc
usage: key-agreement
crypto:
  primitive: key-agree
  functions: [keyderive]
  nist_quantum_security_level: 0
