algorithm: AES-128 (JOSE/JWE)
category: grover
severity: low
title: JWE with 128-bit AES keeps only about 64 bits of security against Grover's algorithm
message: >-
  An encrypted JWT/JWE uses a 128-bit AES key, either for content encryption
  (A128GCM, A128CBC-HS256) or for key wrapping (A128KW, A128GCMKW and the
  PBES2/ECDH-ES variants ending in A128KW). Grover's algorithm halves the
  effective key length, leaving roughly 64 bits of quantum security.
suggestion: >-
  Use the 256-bit variants: A256GCM for content encryption and A256KW or
  A256GCMKW for key wrapping. No automatic fix is offered: every token
  consumer must accept the new algorithm before producers switch, and
  key-wrapping changes also need 256-bit keys.
references:
  - title: "RFC 7518: JSON Web Algorithms (JWA)"
    url: https://www.rfc-editor.org/rfc/rfc7518
  - title: "NIST IR 8547: Transition to Post-Quantum Cryptography Standards"
    url: https://csrc.nist.gov/pubs/ir/8547/final
  - title: "NSA CNSA 2.0 Algorithms (AES-256 required)"
    url: https://media.defense.gov/2022/Sep/07/2003071834/-1/-1/0/CSA_CNSA_2.0_ALGORITHMS_.PDF
crypto:
  primitive: ae
  functions: [encrypt, decrypt]
  parameter_set: '128'
  classical_security_level: 128
  nist_quantum_security_level: 1
