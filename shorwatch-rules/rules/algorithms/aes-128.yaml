algorithm: AES-128
category: grover
severity: low
title: AES-128 keeps only about 64 bits of security against Grover's algorithm
message: >-
  A 128-bit AES key detected. Grover's algorithm gives a quadratic speed-up to
  brute-force key search, so AES-128 drops to roughly 64 bits of quantum
  security. NIST still accepts AES-128 today (it is the reference point for
  post-quantum security category 1), but long-lived secrets and frameworks
  such as NSA CNSA 2.0 call for AES-256.
suggestion: >-
  Use 256-bit keys (AES-256). Unlike public-key migrations this is usually a
  parameter change: the API, the IV and the authentication tag stay the same.
  Keys already stored or shared with other systems must be re-generated and
  re-distributed, so plan a key rotation alongside the code change.
references:
  - title: "FIPS 197: Advanced Encryption Standard (AES)"
    url: https://csrc.nist.gov/pubs/fips/197/final
  - title: "NIST IR 8547: Transition to Post-Quantum Cryptography Standards"
    url: https://csrc.nist.gov/pubs/ir/8547/ipd
  - title: "NSA CNSA 2.0 Algorithms (AES-256 required)"
    url: https://media.defense.gov/2022/Sep/07/2003071834/-1/-1/0/CSA_CNSA_2.0_ALGORITHMS_.PDF
