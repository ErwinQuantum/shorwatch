algorithm: Diffie-Hellman
category: shor
severity: high
title: Finite-field Diffie-Hellman is broken by Shor's algorithm
message: >-
  Classical (finite-field) Diffie-Hellman key agreement detected. Shor's
  algorithm solves the discrete logarithm problem it relies on, so recorded
  handshakes can be decrypted once a large quantum computer exists
  (harvest now, decrypt later).
suggestion: >-
  Replace the key agreement with a key-encapsulation mechanism: ML-KEM
  (FIPS 203). KEMs have a different shape than DH (encapsulate/decapsulate
  instead of a symmetric exchange), so this is a protocol change. A hybrid
  combiner (classical shared secret + ML-KEM shared secret through a KDF)
  keeps today's security guarantees during the transition.
shape_suggestions:
  ephemeral-static: >-
    One side makes a fresh key for each operation and the other has a
    long-lived one (the one-pass Diffie-Hellman of NIST SP 800-56A, as in
    ECIES). That is already the shape of a KEM: the sender encapsulates to the
    recipient's public key, and NIST SP 800-227 section 5.1.1 builds ECDH-KEM
    from exactly this scheme. The move is the same as for encryption: ML-KEM
    (FIPS 203), which keeps the shape, so the protocol around it changes less
    than for a static-static exchange.
  static-static: >-
    Both sides use long-lived key pairs here, each authenticating the other
    (the static unified model of NIST SP 800-56A). ML-KEM (FIPS 203) is the
    algorithm to move to, but there is no one-to-one replacement for this
    shape: the protocol has to change. NIST SP 800-227 section 5.2 gives
    examples of authenticated key establishment built from KEMs (section 5.2.5
    authenticates both parties with static KEM keys in certificates, plus a
    fresh ephemeral KEM key), which are illustrations and not standardized
    protocols. NIST IR 8547 puts every Diffie-Hellman variant of SP 800-56A,
    static or ephemeral, on the same schedule (deprecated after 2030,
    disallowed after 2035), so plan the redesign now.
references:
  - title: "Shorwatch: why Diffie-Hellman is flagged"
    url: https://github.com/ErwinQuantum/shorwatch/blob/main/docs/algorithms/dh.md
  - title: "FIPS 203: Module-Lattice-Based Key-Encapsulation Mechanism Standard (ML-KEM)"
    url: https://csrc.nist.gov/pubs/fips/203/final
  - title: "NIST SP 800-227: Recommendations for Key-Encapsulation Mechanisms"
    url: https://csrc.nist.gov/pubs/sp/800/227/final
  - title: "NIST IR 8547: Transition to Post-Quantum Cryptography Standards"
    url: https://csrc.nist.gov/pubs/ir/8547/final
hybrid: pqc
usage: key-agreement
crypto:
  primitive: key-agree
  functions: [keygen, keyderive]
  nist_quantum_security_level: 0
