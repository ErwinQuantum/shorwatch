algorithm: Diffie-Hellman
category: shor
severity: high
title: Finite-field Diffie-Hellman is broken by Shor's algorithm
message: >-
  Classical (finite-field) Diffie-Hellman key agreement detected. Shor's
  algorithm solves the discrete logarithm problem it relies on, so recorded
  handshakes can be decrypted once a large quantum computer exists
  (harvest now, decrypt later).
suggestion: >-
  Replace the key agreement with a key-encapsulation mechanism: ML-KEM
  (FIPS 203). KEMs have a different shape than DH (encapsulate/decapsulate
  instead of a symmetric exchange), so this is a protocol change. A hybrid
  combiner (classical shared secret + ML-KEM shared secret through a KDF)
  keeps today's security guarantees during the transition.
references:
  - title: "Shorwatch: why Diffie-Hellman is flagged"
    url: https://github.com/ErwinQuantum/shorwatch/blob/main/docs/algorithms/dh.md
  - title: "FIPS 203: Module-Lattice-Based Key-Encapsulation Mechanism Standard (ML-KEM)"
    url: https://csrc.nist.gov/pubs/fips/203/final
  - title: "NIST SP 800-227: Recommendations for Key-Encapsulation Mechanisms"
    url: https://csrc.nist.gov/pubs/sp/800/227/final
  - title: "NIST IR 8547: Transition to Post-Quantum Cryptography Standards"
    url: https://csrc.nist.gov/pubs/ir/8547/final
hybrid: pqc
crypto:
  primitive: key-agree
  functions: [keygen, keyderive]
  nist_quantum_security_level: 0
