id: config.spring-boot.3des
profile: 3des
platform: config

patterns:
  # TLS cipher suites with Triple DES: IANA names (`..._WITH_3DES_EDE_CBC_SHA`)
  # or OpenSSL names (`DES-CBC3-SHA`).
  - property:
      key: '(?i)(^|\.)(ssl|options)\.(ciphers|cipher-?suites|cipher\.suites|enabled-?cipher-?suites)(\[\d+\])?$'
      matches: '(?i)(3DES_EDE|(^|[,:\s])([A-Z0-9]+-)*DES-CBC3-SHA($|[,:\s]))'
