id: config.spring-boot.aes-128
profile: aes-128
platform: config

patterns:
  # TLS cipher suites with a 128-bit AES key (TLS 1.2 and TLS 1.3 names), in
  # IANA form (`AES_128`) or OpenSSL form (`ECDHE-RSA-AES128-GCM-SHA256`).
  - property:
      key: '(?i)(^|\.)(ssl|options)\.(ciphers|cipher-?suites|cipher\.suites|enabled-?cipher-?suites)(\[\d+\])?$'
      matches: '(?i)(^|[,:\s])(TLS_\w*AES_128_|([A-Z0-9]+-)*AES128-(GCM-SHA256|SHA(256)?|CCM8?)($|[,:\s]))'
