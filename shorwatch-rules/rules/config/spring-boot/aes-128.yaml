id: config.spring-boot.aes-128
profile: aes-128
platform: config

patterns:
  # TLS cipher suites with a 128-bit AES key (TLS 1.2 and TLS 1.3 names).
  - property:
      key: '(?i)(^|\.)(ssl|options)\.(ciphers|cipher-?suites|enabled-?cipher-?suites)(\[\d+\])?$'
      matches: '(?i)(^|[,\s])TLS_\w*AES_128_'
