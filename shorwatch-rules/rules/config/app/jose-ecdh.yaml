id: config.app.jose-ecdh
profile: jose-ecdh
platform: config

patterns:
  # Application-defined JWE key-management settings such as `mail.jwe.alg`,
  # usually injected with @Value. Only exact JOSE names count, so unrelated
  # "algorithm" settings stay quiet.
  - property:
      key: '(?i)(^|\.)(alg|algorithms?)(\[\d+\])?$'
      matches: '^ECDH-ES(\+A(128|192|256)KW)?$'
      shape: ephemeral-static
  # ECDH-1PU adds a static key of the sender: not one of the three shapes
  # (and not defined by RFC 7518), so it stays undetermined.
  - property:
      key: '(?i)(^|\.)(alg|algorithms?)(\[\d+\])?$'
      matches: '^ECDH-1PU(\+A(128|192|256)KW)?$'
