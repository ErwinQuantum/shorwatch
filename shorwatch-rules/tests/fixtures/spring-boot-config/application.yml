# Typical resource server + TLS settings of a Spring Boot service.
spring:
  application:
    name: orders
  security:
    oauth2:
      resourceserver:
        jwt:
          jws-algorithms: [RS256, ES256]
          public-key-location: classpath:keys/issuer.pub

server:
  port: 8443
  ssl:
    key-store: classpath:server.p12
    ciphers:
      - TLS_ECDHE_RSA_WITH_AES_256_GCM_SHA384
      - TLS_AES_128_GCM_SHA256

jwt:
  issuer: https://auth.example.com
  algorithm: PS512

# More application-defined JWT settings: ECDSA and EdDSA names.
token:
  signing-algorithm: ES384
partner:
  signature-algorithm: Ed25519
mailbox:
  # An encrypted token (JWE): key agreement, not a signature.
  alg: ECDH-ES+A256KW
  # Its content encryption: a 128-bit AES key.
  enc: A128GCM
