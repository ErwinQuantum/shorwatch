# Profile kept for an old partner integration.
server.ssl.ciphers=TLS_RSA_WITH_3DES_EDE_CBC_SHA,\
  TLS_RSA_WITH_AES_128_CBC_SHA
encrypt.key-store.location=classpath:/config-server.jks
encrypt.key-store.alias=config
# Kafka's own key, passed through Spring Boot; the dot inside the name is not a separator.
spring.kafka.properties.ssl.cipher.suites=TLS_RSA_WITH_AES_128_GCM_SHA256
# Tomcat also takes OpenSSL suite names.
spring.ssl.bundle.jks.partner.options.ciphers=ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-AES256-GCM-SHA384
