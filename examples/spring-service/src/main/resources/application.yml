spring:
  application:
    name: payments
  security:
    oauth2:
      resourceserver:
        jwt:
          jws-algorithms: [RS256]

server:
  port: 8443
  ssl:
    key-store: classpath:payments.p12
    ciphers: TLS_ECDHE_RSA_WITH_AES_256_GCM_SHA384,TLS_AES_256_GCM_SHA384

payments:
  webhooks:
    signing-algorithm: HS256
